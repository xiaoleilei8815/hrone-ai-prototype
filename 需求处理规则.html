<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础设置-需求处理规则</title>
<style>
:root{--blue:#3994f4;--blue-dark:#2585eb;--blue-pale:#eef6ff;--ink:#333943;--muted:#7e8794;--line:#e5e9ef;--surface:#fff;--page:#f7f8fa;--red:#ef4444}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.top-meta{height:58px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 28px;gap:22px;border-bottom:1px solid #f0f1f2;color:#333}.top-meta .lang{font-size:14px}.mail{position:relative;font-size:19px}.mail b{position:absolute;left:12px;top:-9px;background:#f05252;color:#fff;border-radius:18px;padding:1px 8px;font-size:11px;font-weight:500}.avatar{width:32px;height:32px;border:2px solid #999;border-radius:50%;display:grid;place-items:center;color:#888;font-size:18px}.username{white-space:nowrap}.power{font-size:22px;margin-left:12px}.global-nav{height:48px;background:#3994f4;display:flex;align-items:stretch;padding:0 28px;overflow:auto}.global-nav a{color:#fff;text-decoration:none;padding:0 14px;display:flex;align-items:center;font-size:15px;white-space:nowrap}.global-nav a.active{background:#2c83e7}.tabs{height:48px;background:#fff;display:flex;align-items:stretch;box-shadow:0 2px 4px #12223b16;overflow-x:auto}.tab{min-width:150px;padding:0 16px;border-right:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;color:#626a78;text-decoration:none;white-space:nowrap}.tab:first-child{min-width:145px;padding-left:34px}.tab.active{background:#eff6ff;color:var(--blue)}.tab .close{font-size:16px;color:#7e8794}.main{padding:0 16px 28px;min-height:calc(100vh - 154px);background:#fff}.setting-tabs{height:56px;display:flex;align-items:stretch;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}.setting-tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:0 10px;font-weight:600;font-size:15px;white-space:nowrap}.setting-tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}.section{margin:0 0 34px}.section-title{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:15px;font-weight:650}.section-title:before{content:"";width:3px;height:18px;background:var(--blue)}.sub-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 14px}.help{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#559cf4;color:#fff;font-size:12px;font-weight:700;cursor:help}.help:after{content:attr(data-tip);display:none;position:fixed;z-index:1000;left:var(--tip-left,50%);top:var(--tip-top,50%);transform:translateY(-100%);width:max-content;max-width:min(360px,calc(100vw - 24px));white-space:normal;padding:10px 12px;background:#333;color:#fff;border-radius:6px;font-size:12px;line-height:1.55;font-weight:400;box-shadow:0 4px 16px #0002;pointer-events:none}.help:before{content:"";display:none;position:fixed;left:var(--tip-arrow-left,var(--tip-left,50%));top:var(--tip-top,50%);transform:translate(-50%,-2px);border:6px solid transparent;border-top-color:#333;z-index:1001;pointer-events:none}.help:hover:after,.help:hover:before,.help:focus:after,.help:focus:before{display:block}.rule-table-wrap{border:1px solid var(--line);max-width:1020px;overflow:auto}.rule-table{width:100%;min-width:820px;border-collapse:collapse;table-layout:fixed}.rule-table th{height:54px;text-align:left;color:#606875;background:#fafbfc;font-weight:600;border-bottom:1px solid var(--line);padding:0 18px}.rule-table td{height:82px;border-bottom:1px solid var(--line);padding:16px 18px}.rule-table tr:last-child td{border-bottom:0}.rule-table th:nth-child(1){width:28%}.rule-table th:nth-child(2){width:27%}.rule-table th:nth-child(3){width:28%}.rule-table th:nth-child(4){width:17%}.required{color:var(--red);margin-right:5px}.select,.number{height:38px;border:1px solid #cfd4dc;border-radius:6px;background:#fff;padding:0 12px;min-width:0;width:100%;outline:none}.select:focus,.number:focus{border-color:var(--blue);box-shadow:0 0 0 2px #3994f41a}.number-wrap{display:flex;max-width:190px}.number-wrap input{border-radius:6px 0 0 6px}.suffix{height:38px;min-width:48px;display:grid;place-items:center;background:#f5f6f8;border:1px solid #cfd4dc;border-left:0;border-radius:0 6px 6px 0;color:#9299a3}.delete{border:0;background:none;color:var(--blue);padding:6px 0}.add-row{width:100%;height:48px;border:0;background:#fff;color:var(--blue);font-weight:600}.add-row:hover,.delete:hover{color:#1678dd}.empty-row{text-align:center;color:#9ba3ae;padding:24px!important}.date-panel{max-width:1020px;border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#fff}.radio-row{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px}.radio-row + .radio-row{margin-top:8px}.radio-row input{accent-color:var(--blue);width:16px;height:16px;margin:0}.inline-select{width:110px;height:36px;border:1px solid #d4d9e0;border-radius:6px;background:#f7f8fa;padding:0 10px}.inline-number{width:70px;height:36px;border:1px solid #d4d9e0;border-radius:6px;background:#f7f8fa;padding:0 10px}.muted-option{color:#757e8a}.savebar{position:sticky;bottom:0;display:flex;justify-content:center;padding:14px 16px 10px;background:rgba(255,255,255,.97);box-shadow:0 -8px 22px rgba(31,52,80,.12);z-index:10}.save{height:42px;min-width:100px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:600;box-shadow:0 2px 4px #2e87df33}.save:hover{background:var(--blue-dark)}.toast{position:fixed;z-index:50;top:18px;left:50%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:#fff;border-radius:7px;padding:10px 18px;box-shadow:0 6px 24px #1c2a421f;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.top-meta{height:48px;padding:0 12px;gap:12px}.global-nav{padding:0 8px;height:44px}.global-nav a{font-size:13px;padding:0 11px}.tab{min-width:125px;padding:0 12px}.tab:first-child{min-width:82px;padding-left:16px}.main{padding:0 12px 22px}.setting-tabs{gap:8px;margin-bottom:18px}.setting-tabs button{font-size:14px;padding:0 7px}.section{margin-bottom:26px}.rule-table th,.rule-table td{padding-left:12px;padding-right:12px}.date-panel{padding:14px}.radio-row{flex-wrap:wrap;gap:8px}}
.nav-group{position:relative;display:flex;align-items:stretch}.nav-trigger{border:0;background:transparent;color:#fff;padding:0 14px;font-size:15px;white-space:nowrap}.nav-group.active .nav-trigger,.nav-group:hover .nav-trigger,.nav-group:focus-within .nav-trigger{background:#2c83e7}.nav-menu{display:none;position:absolute;z-index:25;left:0;top:100%;width:190px;padding:12px 0;background:#fff;color:var(--ink);box-shadow:0 6px 20px #0002;border-radius:0 0 4px 4px}.nav-group:hover .nav-menu,.nav-group:focus-within .nav-menu{display:block}.nav-menu strong{display:block;padding:7px 20px;font-size:15px}.nav-menu a{display:block!important;padding:9px 22px!important;color:#6d737d!important;font-size:14px!important;text-decoration:none}.nav-menu a:hover,.nav-menu a.active{color:var(--blue)!important;background:#f4f8ff}.limit-title{background:#fff4d8;padding:2px 4px;width:max-content}.rule-table tr.is-new td{background:#f3f6fa}.rule-table tr.is-new .select,.rule-table tr.is-new .number{background:#fff}.inline-number::-webkit-inner-spin-button,.number::-webkit-inner-spin-button{opacity:1}.section.response-section{margin-top:42px}.section.response-section>.section-title{margin-bottom:26px}
/* 按 OTWS 试工评估的字号与紧凑控件比例统一页面节奏 */
.top-meta{height:56px;padding:0 24px;gap:18px}
.global-nav{height:50px;padding:0 24px}
.global-nav a,.nav-trigger{font-size:14px;padding-left:13px;padding-right:13px}
.tabs{height:46px}
.tab{min-width:138px;padding:0 14px;font-size:13px}
.tab:first-child{min-width:130px;padding-left:28px}
.main{padding:0 24px 28px}
.setting-tabs{height:50px;gap:20px;margin-bottom:20px}
.setting-tabs button{font-size:14px;padding:0 9px}
.section{margin-bottom:30px}
.section-title{font-size:16px;margin-bottom:20px;gap:10px}
.section-title:before{height:17px}
.sub-title{font-size:14px;margin-bottom:12px}
.help{width:17px;height:17px;font-size:11px;flex:0 0 17px}
.rule-table-wrap,.date-panel{max-width:1020px;border-radius:6px}
.rule-table th{height:48px;padding:0 16px;font-size:13px}
.rule-table td{height:70px;padding:12px 16px}
.select,.number{height:36px;border-radius:4px;padding:0 10px;font-size:13px}
.number-wrap{max-width:180px}
.number-wrap input{border-radius:4px 0 0 4px}
.suffix{height:36px;min-width:42px;border-radius:0 4px 4px 0;font-size:13px}
.delete{padding:5px 0;font-size:13px}
.add-row{height:42px;font-size:13px}
.date-panel{padding:14px 18px}
.radio-row{min-height:40px;font-size:13px;gap:10px}
.radio-row + .radio-row{margin-top:6px}
.radio-row input{width:15px;height:15px}
.inline-select,.inline-number{height:34px;border-radius:4px;font-size:13px}
.limit-title{padding:2px 5px;border-radius:2px}
.section.response-section{margin-top:36px}
.section.response-section>.section-title{margin-bottom:22px}
.savebar{padding:12px 16px 9px;box-shadow:0 -10px 24px rgba(31,52,80,.16)}
.save{height:36px;min-width:100px;border-radius:4px;font-size:14px;box-shadow:0 2px 4px #2e87df2b}
.toast{font-size:13px}
@media(max-width:760px){.top-meta{height:48px;padding:0 12px;gap:12px}.global-nav{height:44px;padding:0 8px}.tabs{height:44px}.main{padding:0 12px 22px}.setting-tabs{gap:8px;margin-bottom:18px}.section{margin-bottom:26px}.rule-table th,.rule-table td{padding-left:12px;padding-right:12px}.date-panel{padding:14px}.savebar{padding-left:12px;padding-right:12px}}
</style></head>
<body>
<div class="top-meta"><span class="lang">中文(简体)　⌄</span><span class="mail">✉<b>686</b></span><span class="avatar">♙</span><span class="username">肖雷雷　⌄</span><span class="power">⏻</span></div>
<nav class="global-nav"><a href="#">首页</a><a href="#">供应商管理</a><div class="nav-group active"><button class="nav-trigger" aria-haspopup="true">需求管理</button><div class="nav-menu"><strong>需求管理</strong><a href="#">临时工需求管理</a><a href="#">需求分析报表</a><a href="#">用工需求申请</a><a href="#">用工需求池</a><a href="#">工种设置</a><a href="#" class="active">基础设置</a></div></div><a href="#">用工管理</a><a href="#">考勤管理</a><a href="#">核算管理</a><a href="#">报账管理</a><a href="#">设备管理</a><a href="#">系统管理</a></nav>
<nav class="tabs"><a class="tab" href="#">首页</a><a class="tab active" href="#">基础设置 <span class="close">×</span></a></nav>
<main class="main">
<nav class="setting-tabs" aria-label="基础设置"><button>审批人配置</button><button>发单负责人配置</button><button class="active">需求处理规则</button><button>用工检测配置</button></nav>
<section class="section"><h1 class="section-title">发单规则</h1><h2 class="sub-title limit-title">发单人数限制 <span class="help" tabindex="0" data-tip="未设置则表示不限制发单人数">?</span></h2>
<div class="rule-table-wrap"><table class="rule-table"><thead><tr><th><span class="required">*</span>区域</th><th><span class="required">*</span>允许上浮比例 <span class="help" tabindex="0" data-tip="发单人数不能超过需求总人数*(1+上浮比例)">?</span></th><th><span class="required">*</span>取整规则</th><th>操作</th></tr></thead><tbody id="rules"></tbody><tfoot><tr><td colspan="4"><button class="add-row" id="addRule">⊕ 添加</button></td></tr></tfoot></table></div></section>
<section class="section"><h2 class="sub-title limit-title">发单日期限制</h2><div class="date-panel"><label class="radio-row"><input type="radio" name="orderDateRule" value="blocked"><span>过往日期不允许发单</span></label><label class="radio-row muted-option"><input type="radio" name="orderDateRule" value="delayed" checked><span>班次类型为</span><select class="inline-select" aria-label="班次类型"><option>晚班</option><option>早班</option><option>中班</option></select><span>时，可延迟</span><input class="inline-number" type="number" min="0" step="1" value="1" aria-label="延迟天数"><select class="inline-select" aria-label="延迟单位"><option>天</option><option>小时</option></select><span>派遣</span></label></div></section>
<section class="section response-section"><h2 class="section-title">需求响应规则</h2><h3 class="sub-title limit-title" style="margin-top:22px">派遣人数限制 <span class="help" tabindex="0" data-tip="未设置则表示不限制派遣人数">?</span></h3><div class="rule-table-wrap"><table class="rule-table"><thead><tr><th><span class="required">*</span>区域</th><th><span class="required">*</span>允许上浮比例 <span class="help" tabindex="0" data-tip="派遣人数不能超过需求人数*(1+上浮比例)">?</span></th><th><span class="required">*</span>取整规则</th><th>操作</th></tr></thead><tbody id="dispatchRules"></tbody><tfoot><tr><td colspan="4"><button class="add-row" id="addDispatchRule" type="button">⊕ 添加</button></td></tr></tfoot></table></div><h3 class="sub-title limit-title" style="margin-top:30px">派遣日期限制</h3><div class="date-panel"><label class="radio-row"><input type="radio" name="dispatchDateRule" value="blocked"><span>过往日期，不允许派遣</span></label><label class="radio-row muted-option"><input type="radio" name="dispatchDateRule" value="delayed" checked><span>班次类型为</span><select class="inline-select" aria-label="派遣班次类型"><option>晚班</option><option>早班</option><option>中班</option></select><span>时，可延迟</span><input class="inline-number" type="number" min="0" step="1" value="1" aria-label="派遣延迟天数"><select class="inline-select" aria-label="派遣延迟单位"><option>天</option><option>小时</option></select><span>派遣</span></label></div></section>
<div class="savebar"><button class="save" id="saveBtn">保存</button></div>
</main><div class="toast" id="toast" role="status">配置已保存</div>
<script>
(()=>{
 const regions=['FBU法国区','天运星','肖雷雷验收专区','FBU德国区','FBU美西区','FBU英国区'];
 const configurations=[
  {body:'rules',add:'addRule',rules:[{region:'FBU法国区',ratio:10,round:'floor'},{region:'天运星',ratio:100,round:'ceil'},{region:'肖雷雷验收专区',ratio:100,round:'ceil'}]},
  {body:'dispatchRules',add:'addDispatchRule',rules:[{region:'FBU法国区',ratio:10,round:'floor'},{region:'天运星',ratio:100,round:'ceil'},{region:'肖雷雷验收专区',ratio:100,round:'ceil'}]}
 ];
 function render(config){
  const tbody=document.getElementById(config.body),rules=config.rules;
  tbody.innerHTML=rules.length?rules.map((r,i)=>`<tr class="${r.isNew?'is-new':''}"><td><select class="select region" aria-label="区域" data-index="${i}"><option value="" ${r.region===''?'selected':''}>请选择</option>${regions.map(name=>`<option value="${name}" ${r.region===name?'selected':''}>${name}</option>`).join('')}</select></td><td><div class="number-wrap"><input class="number ratio" type="number" min="0" max="100" step="1" value="${r.ratio??''}" placeholder="请输入" aria-label="允许上浮比例"><span class="suffix">%</span></div></td><td><select class="select rounding" aria-label="取整规则"><option value="floor" ${r.round==='floor'?'selected':''}>向下取整</option><option value="ceil" ${r.round==='ceil'?'selected':''}>向上取整</option></select></td><td><button class="delete" type="button" data-delete="${i}">删除</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty-row">暂无区域规则，请添加</td></tr>';
  tbody.querySelectorAll('.region').forEach(el=>el.addEventListener('change',e=>rules[+e.target.dataset.index].region=e.target.value));
  tbody.querySelectorAll('.ratio').forEach((el,i)=>el.addEventListener('input',e=>rules[i].ratio=e.target.value));
  tbody.querySelectorAll('.rounding').forEach((el,i)=>el.addEventListener('change',e=>rules[i].round=e.target.value));
  tbody.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{rules.splice(+el.dataset.delete,1);render(config)}));
 }
 configurations.forEach(config=>{render(config);document.getElementById(config.add).addEventListener('click',()=>{config.rules.push({region:'',ratio:'',round:'ceil',isNew:true});render(config)})});
 document.getElementById('saveBtn').addEventListener('click',()=>{const invalid=configurations.some(config=>config.rules.some(rule=>!rule.region||rule.ratio===''||+rule.ratio<0||+rule.ratio>100));if(invalid){alert('请填写区域及 0 至 100 之间的允许上浮比例');return}const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)});
 document.querySelectorAll('.help').forEach(help=>{const place=()=>{const rect=help.getBoundingClientRect();const width=Math.min(360,window.innerWidth-24);const left=Math.max(12,Math.min(window.innerWidth-width-12,rect.left+rect.width/2-width/2));const top=Math.max(64,rect.top-10);help.style.setProperty('--tip-left',`${left}px`);help.style.setProperty('--tip-top',`${top}px`)};help.addEventListener('pointerenter',place);help.addEventListener('focus',place);window.addEventListener('resize',place,{passive:true})});
})();
</script><script defer src="prototype-switcher.js"></script></body></html>
