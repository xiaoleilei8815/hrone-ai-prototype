<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>门户-派遣人员名单</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#30343b;background:#f4f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:#f4f6fb}.mobile-shell{width:min(100%,540px);min-height:100vh;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #e7ebf2}.topbar{height:62px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:0 18px;border-bottom:1px solid #edf0f5;position:sticky;top:0;background:#fff;z-index:5}.back{border:0;background:none;color:#1681ff;font-size:16px;text-align:left;padding:8px 0;cursor:pointer}.topbar h1{font-size:18px;text-align:center;margin:0;font-weight:650}.count{font-size:14px;color:#707a89;text-align:right}.search{height:48px;margin:16px 18px 20px;padding:0 16px;border-radius:26px;background:#f3f5f8;display:flex;align-items:center;gap:10px;color:#8a94a3}.search svg{width:20px;flex:none}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;font-size:15px;color:#343a44}.search input::placeholder{color:#a8b0bc}.demand{padding:0 22px 18px;border-bottom:5px solid #f4f6fb}.demand-name{font-size:16px;line-height:1.5;margin:0 0 18px;color:#1681ff;font-weight:600}.info{display:grid;gap:12px}.info-row{display:grid;grid-template-columns:23px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.55}.info-row svg{width:20px;height:20px;color:#929ba8;margin-top:1px}.info-label{color:#4a505a}.info-value{color:#333942}.collapse{display:block;margin:15px auto 0;border:0;background:none;color:#1681ff;font-size:14px;padding:6px 10px;cursor:pointer}.employee-list{padding:0 18px 20px}.employee{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:16px 0;border-bottom:1px solid #e9edf2;align-items:center}.employee-main{min-width:0}.person{font-size:15px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.department{font-size:13px;color:#858d99;margin-top:5px;line-height:1.4;overflow-wrap:anywhere}.employee-side{display:flex;align-items:center;gap:10px}.date-status{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:88px}.date{font-size:13px;color:#454b55}.tag{font-size:12px;border-radius:6px;padding:3px 8px;white-space:nowrap;border:1px solid}.tag.pending{color:#e88919;background:#fff7e8;border-color:#ffd18b}.tag.pass{color:#08a879;background:#edfbf6;border-color:#a9edd8}.tag.fail{color:#eb5555;background:#fff1f0;border-color:#ffc2bd}.tag.absent{color:#7b818b;background:#f4f5f6;border-color:#d9dce1}.actions{display:flex;gap:7px}.icon-btn{width:32px;height:32px;border:0;border-radius:8px;background:#eff5ff;color:#1681ff;display:grid;place-items:center;cursor:pointer}.icon-btn svg{width:16px;height:16px}.icon-btn:disabled{color:#adb5c0;background:#f1f2f4;cursor:not-allowed}.icon-btn:disabled:hover{background:#f1f2f4}.empty{display:none;padding:38px 10px;text-align:center;color:#9aa2ad;font-size:14px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#30343b;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(min-width:700px){body{padding:28px 0}.mobile-shell{border-radius:14px;overflow:hidden;min-height:calc(100vh - 56px)}}@media(max-width:390px){.topbar{padding:0 14px}.topbar h1{font-size:17px}.demand{padding-left:18px;padding-right:18px}.employee-list{padding-left:15px;padding-right:15px}.employee{grid-template-columns:minmax(0,1fr) auto;gap:6px}.employee-side{gap:6px}.date-status{min-width:78px}.actions{gap:4px}}
</style>
</head>
<body>
<main class="mobile-shell">
  <header class="topbar"><button class="back" id="backButton" type="button">‹ 返回</button><h1>派遣人员名单 <span id="titleCount"></span></h1><span class="count" aria-hidden="true"></span></header>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="通过编号/工号/姓名搜索" aria-label="通过编号、工号或姓名搜索"></label>
  <section class="demand" aria-label="用工需求详情">
    <h2 class="demand-name">叉车司机-肖雷雷验收专区/XLL-早班(09:00~18:00)</h2>
    <div class="info" id="demandInfo">
      <div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M4 9.5h16M7.5 13h3m2 0h4m-9 4h3"/></svg><div><span class="info-label">日期：</span><span class="info-value" id="dateRange"></span></div></div>
      <div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></svg><div><span class="info-label">地点：</span><span class="info-value">肖雷雷验收专区-肖雷雷验收专区1仓-肖雷雷验收专区1仓入库组（肖雷雷验收专区1仓所在地）</span></div></div>
      <div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg><div><span class="info-label">人数：</span><span class="info-value">10（待派遣：<b id="pendingCount">3</b>）</span></div></div>
      <div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m7 8 1.4 1.4L11 7m2 2h4m-10 5 1.4 1.4L11 12m2 2h4m-10 4h9"/></svg><div><span class="info-label">要求：</span><span class="info-value">【10人】要求会使用基本电脑操作，需要会讲英语和西语</span></div></div>
      <div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="4"/><path d="M2.5 21v-1a7.5 7.5 0 0 1 15 0v1M17 11h5m-2.5-2.5L22 11l-2.5 2.5"/></svg><div><span class="info-label">建议派遣人员：</span><span class="info-value">--</span></div></div>
    </div>
    <button class="collapse" id="collapseButton" type="button" aria-expanded="true">⌃ 收起</button>
  </section>
  <section class="employee-list" aria-label="派遣人员列表"><div id="employeeRows"></div><div class="empty" id="emptyState">没有找到匹配的派遣人员</div></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const today=new Date(),pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  const start=fmt(today),weekEnd=fmt(add(today,7));document.getElementById('dateRange').textContent=`${start}~${weekEnd}`;
  const people=[
    {name:'肖雷雷100',code:'261104000001',work:'XX184105',date:start,status:'未到场',department:'肖雷雷验收专区'},
    {name:'肖雷雷101',code:'261104000002',work:'XX184107',date:start,status:'试工通过',department:'FBU美西区 / 肖雷雷验收专区'},
    {name:'肖雷雷102',code:'261104000003',work:'XX184109',date:start,status:'试工不通过',department:'FBU美西区 / 肖雷雷验收专区'},
    {name:'肖雷雷103',code:'261104000004',work:'XX184110',date:start,status:'待试工',department:'肖雷雷验收专区 / 入库组'},
    {name:'肖雷雷104',code:'261104000005',work:'XX184111',date:fmt(add(today,1)),status:'试工通过',department:'FBU美西区 / 肖雷雷验收专区'},
    {name:'肖雷雷105',code:'261104000006',work:'XX184112',date:fmt(add(today,2)),status:'未到场',department:'肖雷雷验收专区'},
    {name:'肖雷雷106',code:'261104000007',work:'XX184113',date:fmt(add(today,2)),status:'试工不通过',department:'FBU美西区 / 肖雷雷验收专区'}
  ];
  const classes={'待试工':'pending','试工通过':'pass','试工不通过':'fail','未到场':'absent'},rows=document.getElementById('employeeRows'),query=document.getElementById('searchInput'),empty=document.getElementById('emptyState'),toast=document.getElementById('toast');
  const editIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>',trashIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 10h10l1-10M9 7V4h6v3"/></svg>';
  function render(){const q=query.value.trim().toLowerCase(),filtered=people.filter(p=>[p.name,p.code,p.work].some(v=>v.toLowerCase().includes(q)));document.getElementById('titleCount').textContent=`(${filtered.length})`;document.getElementById('pendingCount').textContent=String(Math.max(0,10-people.length));rows.innerHTML=filtered.map(p=>{const editable=p.status==='待试工'||p.status==='未到场',editTip=editable?'':' title="已经过试工评估的派遣不可调整"',deleteTip=p.status==='待试工'?'':' title="已经过试工评估的派遣不可删除"';return `<article class="employee"><div class="employee-main"><div class="person">${p.name}（${p.work}）</div><div class="department">${p.department}</div></div><div class="employee-side"><div class="date-status"><time class="date">${p.date}</time><span class="tag ${classes[p.status]}">${p.status}</span></div><div class="actions"><button class="icon-btn" type="button" aria-label="编辑派遣日期" data-action="edit" data-work="${p.work}" data-date="${p.date}"${editable?'':' disabled'+editTip}>${editIcon}</button><button class="icon-btn" type="button" aria-label="删除派遣人员" data-action="delete" data-work="${p.work}" data-date="${p.date}"${p.status==='待试工'?'':' disabled'+deleteTip}>${trashIcon}</button></div></div></article>`}).join('');empty.style.display=filtered.length?'none':'block'}
  query.addEventListener('input',render);
  document.getElementById('collapseButton').addEventListener('click',e=>{const info=document.getElementById('demandInfo'),collapsed=info.hidden=!info.hidden;e.currentTarget.setAttribute('aria-expanded',String(!collapsed));e.currentTarget.textContent=collapsed?'⌄ 展开':'⌃ 收起'});
  document.getElementById('backButton').addEventListener('click',()=>{window.location.href='门户-派遣需求.html#detail'});
  rows.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;if(btn.disabled)return;const index=people.findIndex(p=>p.work===btn.dataset.work&&p.date===btn.dataset.date);if(index<0)return;if(btn.dataset.action==='delete'){if(confirm('确定删除这条派遣记录吗？')){people.splice(index,1);render()}}else{const next=prompt('设置派遣开始日期（YYYY-MM-DD）',people[index].date);if(next&&/^\d{4}-\d{2}-\d{2}$/.test(next)){people[index].date=next;people.sort((a,b)=>a.work.localeCompare(b.work,undefined,{numeric:true})||a.date.localeCompare(b.date));render()}else if(next){toast.textContent='请输入有效日期，格式为 YYYY-MM-DD';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}}});
  people.sort((a,b)=>a.work.localeCompare(b.work,undefined,{numeric:true})||a.date.localeCompare(b.date));render();
})();
</script>
</body>
</html>
