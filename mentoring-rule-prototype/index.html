<script>
const orgs=ORG_NODES.map(n=>n.path);const jobs=['分拣员','装卸工','叉车司机','质检员','仓库文员'];const people=[['张晓明','GF184055',0,0],['陈佳','GF184053',1,4],['王志强','TYX184061',2,1],['李雨桐','GF184059',3,2],['赵磊','GF184062',0,4],['刘敏','TYX184068',1,3],['周洋','GF184071',2,0],['孙琳','GF184075',3,4]];people.forEach((p,i)=>{p[2]=ORG_NODES.filter(n=>n.depth===2)[i].id});const key='hrone-mentoring-rules-org-tree-v2';let saved={org:[],job:[],rows:['org','job'],time:''};try{saved=JSON.parse(localStorage.getItem(key))||saved}catch(e){}let orgQuery='',treeOpen=new Set();let draft,expanded=null,busy=false,status='全部';const $=id=>document.getElementById(id);const names={org:'组织',job:'工种'},values={org:orgs,job:jobs};const clone=o=>JSON.parse(JSON.stringify(o));const hit=(p,r)=>orgHit(p[2],r)||r.job.includes(p[3]);const reason=(p,r)=>[orgHit(p[2],r)?'组织命中':'',r.job.includes(p[3])?'工种命中':''].filter(Boolean).join('、');

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const descendants=id=>[id,...ORG_NODES[id].children.flatMap(descendants)];
const leaves=id=>ORG_NODES[id].children.length?ORG_NODES[id].children.flatMap(leaves):[id];
const orgHit=(id,r)=>r.org.some(x=>id===x||ORG_NODES[id].path.startsWith(ORG_NODES[x].path+' / '));
function selectedLeaves(){return new Set(draft.org.flatMap(leaves))}
function toggleOrg(id,on){const selected=selectedLeaves();leaves(id).forEach(x=>on?selected.add(x):selected.delete(x));const collect=id=>leaves(id).every(x=>selected.has(x))?[id]:ORG_NODES[id].children.flatMap(collect);draft.org=ORG_NODES.filter(n=>n.parent===null).flatMap(n=>collect(n.id))}
function orgPicker(){return `<div class="picker"><input type="search" value="${esc(orgQuery)}" placeholder="搜索区域、物理仓或组" aria-label="搜索组织" data-search="org"><div class="org-levels">区域 → 物理仓 → 组</div><div id="orgTree" class="org-tree" aria-label="组织树"></div><div class="hint">可多选；选择区域或物理仓包含下级。</div></div>`}
function drawTree(){if(!$('orgTree'))return;const q=orgQuery.trim().toLowerCase();const visible=new Set();if(q)ORG_NODES.filter(n=>n.path.toLowerCase().includes(q)).forEach(n=>{visible.add(n.id);let p=n.parent;while(p!==null){visible.add(p);p=ORG_NODES[p].parent}});const selected=selectedLeaves();const render=id=>{const n=ORG_NODES[id];if(q&&!visible.has(id))return '';const ls=leaves(id),count=ls.filter(x=>selected.has(x)).length,open=q||treeOpen.has(id);return `<div class="tree-row" style="padding-left:${n.depth*16}px"><button type="button" class="tree-toggle" data-tree="${id}" ${n.children.length?'':'disabled'} aria-label="${open?'收起':'展开'}${esc(n.name)}" aria-expanded="${!!open}">${n.children.length?(open?'▾':'▸'):'·'}</button><label title="${esc(n.path)}"><input type="checkbox" data-org="${id}" ${count===ls.length?'checked':''} data-partial="${count>0&&count<ls.length}"><span>${esc(n.name)}</span></label><small>${['区域','物理仓','组'][n.depth]}</small></div>${open?n.children.map(render).join(''):''}`};$('orgTree').innerHTML=ORG_NODES.filter(n=>n.parent===null).map(n=>render(n.id)).join('')||'<div class="empty">未找到匹配组织</div>';$('orgTree').querySelectorAll('[data-partial="true"]').forEach(e=>e.indeterminate=true)}
function syncTree(){drawTree()}
function renderTable(){const q=$('search').value.trim();$('employees').innerHTML=people.map((p,i)=>({p,i})).filter(({p,i})=>(p[0].includes(q)||p[1].includes(q))&&(status==='全部'||(i%3===0?'派遣中':'未派遣')===status)).map(({p,i})=>`<tr><td><input type="checkbox" aria-label="选择${p[0]}" class="rowcheck"></td><td>${i+1}</td><td>${p[0]}</td><td>${p[1]}</td><td><span class="tag">可用</span></td><td><span class="tag ${i%3?'orange':''}">${i%3?'未派遣':'派遣中'}</span></td><td>${i%2?'AAS-test':'美西测试'}</td><td>${orgs[p[2]]}</td><td>${jobs[p[3]]}</td><td>${hit(p,saved)?'<span class="tag">不需要带教</span>':'需要带教'}</td><td class="muted">${reason(p,saved)||'未命中免带教规则'}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">没有找到匹配员工，请调整查询条件。</td></tr>'}
function renderConditions(){ $('conditions').innerHTML=(draft.rows.length>1?'<span class="bracket"></span><span class="or">或</span>':'')+draft.rows.map(type=>`<div class="condition"><select class="field" data-type="${type}" aria-label="条件类型">${Object.keys(names).map(t=>`<option value="${t}" ${t===type?'selected':''} ${t!==type&&draft.rows.includes(t)?'disabled':''}>${names[t]}${t!==type&&draft.rows.includes(t)?'（已添加）':''}</option>`).join('')}</select><div class="field">属于任一</div><div class="select"><div class="chips">${draft[type].map(i=>`<button class="chip" data-remove="${type}:${i}" title="${esc(values[type][i])}" aria-label="移除${esc(values[type][i])}">${esc(values[type][i].split(' / ').pop())} ×</button>`).join('')}</div><button class="choose" data-pick="${type}" aria-expanded="${expanded===type}">${draft[type].length?'＋ 继续选择':'请选择'+names[type]+'（可多选）'}　⌄</button>${expanded===type?(type==='org'?orgPicker():`<div class="picker"><input type="search" placeholder="搜索工种" aria-label="搜索工种" data-search="job"><div class="options">${jobs.map((v,i)=>`<label><input type="checkbox" data-check="job:${i}" ${draft.job.includes(i)?'checked':''}>${v}</label>`).join('')}</div></div>`):''}</div><button class="remove" data-del="${type}" aria-label="删除${names[type]}条件">⊗</button></div>`).join('')||'<div class="empty">暂无条件。保存后将清空免带教规则。</div>';$('add').disabled=draft.rows.length===2;updatePreview();syncTree()}
function updatePreview(){$('error').textContent=''}
function openModal(){draft=clone(saved);expanded=null;orgQuery='';treeOpen=new Set();$('discard').hidden=true;renderConditions();$('modal').showModal();$('close').focus()}
function requestClose(){if(busy)return;if(JSON.stringify(draft)!==JSON.stringify(saved)){$('discard').hidden=false;$('stay').focus();$('discard').scrollIntoView({block:'nearest'})}else closeModal()}
function closeModal(){$('modal').close();$('open').focus()}
$('open').onclick=openModal;$('close').onclick=$('cancel').onclick=requestClose;$('modal').addEventListener('cancel',e=>{e.preventDefault();requestClose()});$('stay').onclick=()=>{$('discard').hidden=true;$('save').focus()};$('leave').onclick=closeModal;
$('conditions').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tree!==undefined){const id=+b.dataset.tree;treeOpen.has(id)?treeOpen.delete(id):treeOpen.add(id);renderConditions();$('conditions').querySelector(`[data-tree="${id}"]`)?.focus();return}if(b.dataset.pick){expanded=expanded===b.dataset.pick?null:b.dataset.pick;renderConditions();if(expanded)$('conditions').querySelector('[data-search]').focus()}if(b.dataset.del){draft.rows=draft.rows.filter(t=>t!==b.dataset.del);draft[b.dataset.del]=[];renderConditions();$('add').focus()}if(b.dataset.remove){const[t,i]=b.dataset.remove.split(':');draft[t]=draft[t].filter(v=>v!==+i);renderConditions()}};
$('conditions').onchange=e=>{if(e.target.dataset.org!==undefined){const id=+e.target.dataset.org,scroll=$('orgTree').scrollTop;toggleOrg(id,e.target.checked);renderConditions();$('orgTree').scrollTop=scroll;$('conditions').querySelector(`[data-org="${id}"]`)?.focus();return}if(e.target.dataset.type){const old=e.target.dataset.type,next=e.target.value;if(old===next||draft.rows.includes(next))return;draft[old]=[];draft.rows=draft.rows.map(t=>t===old?next:t);expanded=null;renderConditions();$('conditions').querySelector(`[data-type="${next}"]`)?.focus();return}if(e.target.dataset.check){const[t,i]=e.target.dataset.check.split(':');draft[t]=e.target.checked?[...draft[t],+i]:draft[t].filter(v=>v!==+i);const search=$('conditions').querySelector('[data-search]')?.value||'';renderConditions();const input=$('conditions').querySelector('[data-search]');if(input){input.value=search;input.dispatchEvent(new Event('input',{bubbles:true}))}const check=$('conditions').querySelector(`[data-check="${t}:${i}"]`);check?.focus()}};
$('conditions').oninput=e=>{if(e.target.dataset.search==='org'){orgQuery=e.target.value;drawTree();return}if(e.target.dataset.search){e.target.nextElementSibling.querySelectorAll('label').forEach(el=>el.style.display=el.textContent.includes(e.target.value)?'flex':'none')}};
$('add').onclick=()=>{const type=Object.keys(names).find(t=>!draft.rows.includes(t));if(!type)return;draft.rows.push(type);expanded=null;renderConditions();$('conditions').querySelector(`[data-type="${type}"]`)?.focus()};
$('save').onclick=async()=>{if(draft.rows.some(t=>!draft[t].length)){$('error').textContent='请选择条件对应的组织或工种，或删除不需要的条件。';return}busy=true;$('save').disabled=true;$('cancel').disabled=true;$('close').disabled=true;$('save').textContent='保存中…';await new Promise(r=>setTimeout(r,500));try{if(new URLSearchParams(location.search).has('fail'))throw Error('demo');const next=clone(draft);next.time=new Date().toLocaleString('zh-CN');localStorage.setItem(key,JSON.stringify(next));saved=next;renderTable();closeModal();$('notice').style.display='block';$('notice').textContent=`规则已保存，${people.filter(p=>hit(p,saved)).length} 位示例员工标记为不需要带教。`;const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent='✓ 带教规则保存成功';document.body.append(el);setTimeout(()=>el.remove(),3500)}catch(e){$('error').textContent='保存失败，修改已保留，请重试。'}finally{busy=false;$('save').disabled=false;$('cancel').disabled=false;$('close').disabled=false;$('save').textContent='✓ 保存'}};
$('query').onclick=renderTable;$('search').onkeydown=e=>{if(e.key==='Enter')renderTable()};$('reset').onclick=()=>{$('search').value='';status='全部';document.querySelectorAll('.segment button').forEach((b,i)=>b.classList.toggle('primary',i===0));renderTable()};document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{status=b.textContent;document.querySelectorAll('.segment button').forEach(x=>x.classList.toggle('primary',x===b));renderTable()});$('all').onchange=e=>document.querySelectorAll('.rowcheck').forEach(x=>x.checked=e.target.checked);renderTable();if(location.hash==='#rules')openModal();
</script></html>
