  const reason=document.querySelector('#actionFailReason');
  reason.classList.toggle('invalid',!reason.value);
  if(!plansValid||!reason.value){event.preventDefault();event.stopImmediatePropagation();toast('请填写所有必填字段');return}
  record.dispatchStart=start;record.dispatchEnd=end;
  record.attendancePlan=document.querySelector('#attendancePlan').value;
  record.quotePlan=document.querySelector('#quotePlan').value;
  record.trialCards=stagedTrialFiles.map(file=>({name:file.name,type:file.type||'application/octet-stream',size:file.size,fileObject:file,dataUrl:URL.createObjectURL(file)}));
  record.trialCard=record.trialCards.map(file=>file.name).join('; ');
},true);
document.querySelector('.upload-box-tip').textContent='最多5个文件，每个文件最大10MB';
document.querySelector('#trialCardUpload').onchange=event=>{
  for(const file of [...event.target.files]){
    if(file.size>10*1024*1024){toast(file.name+' 超过10MB，未添加');continue}
    if(stagedTrialFiles.length>=5){toast('试工卡最多上传5个文件');break}
    stagedTrialFiles.push(file);
  }
  event.target.value='';renderStagedTrialFiles();
};
document.querySelector('#dispatchDateError').textContent='派遣日期不能早于试工日期，且结束日期不能早于开始日期';
const dispatchStartInput=document.querySelector('#dispatchStart');
const dispatchEndInput=document.querySelector('#dispatchEnd');
dispatchStartInput.addEventListener('change',()=>{dispatchEndInput.min=dispatchStartInput.value||dispatchStartInput.min});
dispatchStartInput.addEventListener('input',()=>{dispatchEndInput.min=dispatchStartInput.value||dispatchStartInput.min});
dispatchStartInput.addEventListener('change',()=>{if(dispatchStartInput.value&&dispatchEndInput.showPicker){try{dispatchEndInput.showPicker()}catch{}}});
document.querySelector('#dispatchDateRange').addEventListener('click',event=>{
  if(event.target.closest('input'))return;
  dispatchStartInput.focus();if(dispatchStartInput.showPicker){try{dispatchStartInput.showPicker()}catch{}}
});
const codeHeader=[...document.querySelectorAll('thead th')].find(header=>header.textContent.trim()==='编号');
if(codeHeader&&!codeHeader.querySelector('.help-tip')){
  const tip=document.createElement('span');tip.className='help-tip';tip.textContent='?';
  tip.dataset.tip='供应商使用，对于供应商来说是唯一的';tip.setAttribute('aria-label',tip.dataset.tip);tip.tabIndex=0;
  codeHeader.append(' ',tip);
  tip.addEventListener('mouseenter',()=>showColumnTooltip(tip));tip.addEventListener('mouseleave',hideColumnTooltip);
  tip.addEventListener('focus',()=>showColumnTooltip(tip));tip.addEventListener('blur',hideColumnTooltip);
}
</script></body></html>
