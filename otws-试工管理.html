    for(const [rowIndex,row] of [...table.querySelectorAll('#rows tr')].entries()){
      const record=renderedRecords[rowIndex];if(!record)continue;
      const index=records.indexOf(record),cell=row.querySelector('td.freeze1');if(!cell)continue;
      let checkbox=cell.querySelector('.bulk-row-check');
      if(!checkbox){const date=cell.textContent.trim();checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.className='bulk-row-check';checkbox.dataset.record=index;const label=document.createElement('span');label.className='bulk-date-label';label.textContent=date;cell.replaceChildren(checkbox,label);}
      checkbox.disabled=record.status!=='待试工';
      checkbox.setAttribute('aria-label',record.status==='待试工'?'选择 '+record.name+'，待试工':'不可选择 '+record.name+'，当前状态：'+record.status);
      checkbox.title=record.status==='待试工'?'选择待试工记录':'仅待试工记录可批量操作';
      checkbox.checked=record.status==='待试工'&&selected.has(index);
    }
  }
  const baseRender=render;
  render=function(){baseRender();syncControls()};
  table.addEventListener('change',event=>{
    if(event.target.matches('.bulk-row-check')){const index=Number(event.target.dataset.record);event.target.checked?selected.add(index):selected.delete(index);syncControls()}
    if(event.target.matches('.bulk-head-check')){for(const index of visiblePending())event.target.checked?selected.add(index):selected.delete(index);syncControls()}
  });
  function openBulkDialog(status){
    const chosen=getRecords();if(!chosen.length)return;
    activeStatus=status;error.hidden=true;title.textContent=`批量${status}`;
    batchDateInputs.forEach(input=>{input.value='';input.min=''});syncBatchDatePlaceholders();batchPlanSelects.forEach(select=>{select.value=''});batchFailureState.reasons=[];batchReasonPicker.querySelector('.fail-reason-clear').click();batchFailDetailInput.value='';batchError.hidden=true;
    personState.clear();currentPage=0;
    renderPeople(chosen);
    const needsSettlement=chosen.filter(record=>settlementRule(record.region)==='yes');
    dialog.hidden=false;dialog.querySelector('.bulk-confirm').focus();
  }
  for(const button of batchButtons)button.addEventListener('click',()=>openBulkDialog(button.dataset.bulkStatus));
  function closeBulkDialog(){activeBulkReasonPicker?.close();dialog.hidden=true;activeStatus=''}
  dialog.querySelector('.bulk-close').addEventListener('click',closeBulkDialog);
  dialog.querySelector('.bulk-cancel').addEventListener('click',closeBulkDialog);
  dialog.addEventListener('click',event=>{if(event.target===dialog)closeBulkDialog()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.hidden)closeBulkDialog()});
  dialog.querySelector('.bulk-confirm').addEventListener('click',()=>{
    const chosen=getRecords();if(!chosen.length){closeBulkDialog();return}
    for(const record of chosen){
      const state=personState.get(records.indexOf(record));
      const start=state?.start||record.date,end=state?.end||record.date;
      if(activeStatus==='试工通过'&&(!start||!end||start<record.date||end<start)){
        error.textContent=`${record.name}的派遣日期无效：开始日期不得早于试工日期，结束日期不得早于开始日期。`;error.hidden=false;return;
      }
      const needsPlan=activeStatus==='试工通过'||(activeStatus==='试工不通过'&&settlementRule(record.region)==='yes');
      if(activeStatus==='试工不通过'&&needsPlan&&(!start||!end||start<record.date||end<start)){
        error.textContent=`${record.name}的派遣日期无效：开始日期不得早于试工日期，结束日期不能早于开始日期。`;error.hidden=false;revealBulkRecord(record,'.bulk-fail-dispatch-range input');return;
      }
      if(needsPlan&&(!state?.attendance||!state?.quote)){
        error.textContent=`请为${record.name}选择考勤方案和报价方案。`;error.hidden=false;revealBulkRecord(record,'[data-plan]');return;
      }
    }
    if(activeStatus==='试工不通过'){
      const missing=chosen.find(record=>!(personState.get(records.indexOf(record))?.reasons.length));
      if(missing){error.textContent='请为'+missing.name+'选择至少一个试工不通过原因';error.hidden=false;revealBulkRecord(missing,'.bulk-person-reason-picker .fail-reason-trigger');return}
    }
    const now=new Date(),pad=value=>String(value).padStart(2,'0');
    const modifiedAt=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
    for(const record of chosen){
      const state=personState.get(records.indexOf(record));
      if(activeStatus==='试工通过'||(activeStatus==='试工不通过'&&settlementRule(record.region)==='yes')){
        record.dispatchStart=activeStatus==='试工通过'||activeStatus==='试工不通过'?(state.start||record.date):record.date;
        record.dispatchEnd=activeStatus==='试工通过'||activeStatus==='试工不通过'?(state.end||record.date):record.date;
        record.attendancePlan=state.attendance;
        record.quotePlan=state.quote;
      }
      if(activeStatus==='试工不通过'){
        record.failReason=(state?.reasons||[]).join('、');record.failDetail=state?.failDetail.trim()||'--';
      }else{record.failReason='--';record.failDetail='--'}
      if(activeStatus!=='未到场'){
        record.trialCards=(state?.files||[]).map(file=>({name:file.name,type:file.type||'application/octet-stream',size:file.size,fileObject:file,dataUrl:URL.createObjectURL(file)}));
        record.trialCard=record.trialCards.map(file=>file.name).join('; ')||'--';
      }
      record.status=activeStatus;record.modifiedBy='张敏(WUS180206)';record.modifiedAt=modifiedAt;
    }
    selected.clear();closeBulkDialog();render();toast(`已批量更新 ${chosen.length} 人：${activeStatus}`);
  });
  syncControls();
})();
</script><script defer src="prototype-switcher.js"></script></body></html>
